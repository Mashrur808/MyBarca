<html>
<head>
    <title>My Barça Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b20;
            color: white;
            text-align: center;
        }

        header {
            background: linear-gradient(135deg, #004d98, #a50044);
            padding: 35px 15px;
        }

        header h1 {
            font-size: 42px;
            margin: 10px 0;
        }

        header p {
            font-size: 18px;
        }

        .container {
            padding: 25px;
        }

        .card {
            background: #171735;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        .card img {
            width: 100%;
            max-width: 350px;
            border-radius: 15px;
        }

        .card h2 {
            color: #ffcc00;
        }

        button {
            background: #a50044;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #004d98;
        }

        footer {
            background: #050510;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🔵🔴 VISCA BARÇA 🔴🔵</h1>
        <p>Welcome to my Barcelona website</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>FC Barcelona</h2>

            <img src="image_750x_66997c1df323c.png" width="300">

            <p>
                More than a club ❤️💙
            </p>

            <button onclick="alert('Visca Barça! 🔵🔴')">
                Click Me
            </button>
        </div>

        <div class="card">
            <h2>My Favourite Player</h2>

            <img src="LeoMessi20092010_pic_fcb-arsenal62.jpg" width="300">

            <p>
                Lionel Messi 🐐
            </p>
        </div>

    </div>

    <footer>
        <p>Made by Me ❤️💙</p>
    </footer>

</body>
</html>
